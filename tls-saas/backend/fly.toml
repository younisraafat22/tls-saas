# fly.toml app configuration file for backend-cold-sound-6496

app = 'backend-cold-sound-6496'
primary_region = 'fra'

[build]

[env]
  PORT = "8000"
  BROWSER_HEADLESS = "true"

[mounts]
  source = "tls_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
